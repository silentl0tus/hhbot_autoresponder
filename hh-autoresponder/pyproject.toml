[project]
name = "hh-autoresponder"
version = "1.0.0"
description = "Telegram-бот авто-откликов на вакансии hh.ru (config-driven, AI опционален)"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "aiogram>=3.14.0",
    "httpx[socks]>=0.28.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
    "apscheduler>=3.10.4",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "structlog>=24.4.0",
    "playwright>=1.40.0",
    "aiolimiter>=1.1.0",
    "aiohttp-socks>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
